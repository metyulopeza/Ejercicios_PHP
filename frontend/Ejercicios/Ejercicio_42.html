<h3>Ejercicio 42 - Diagnóstico de Anemia (Nivel Hemoglobina)</h3>
<form action="/Ejercicios_PHP/backend/Ejercicio_42.php" method="post">
    <label for="edad_meses">Edad en Meses</label>
    <input type="number" id="edad_meses" name="edad_meses" placeholder="Ej: 24" step="1" required>
<br>
    <label for="sexo">Sexo (M/F)</label>
    <input type="text" id="sexo" name="sexo" placeholder="Ej: F" required>
<br>
    <label for="hemoglobina">Nivel de Hemoglobina (g%)</label>
    <input type="number" id="hemoglobina" name="hemoglobina" placeholder="Ej: 12.5" step="0.1" required>
<br>
    <button type="submit">Procesar</button>
</form>

<p class="resultado"></p>
