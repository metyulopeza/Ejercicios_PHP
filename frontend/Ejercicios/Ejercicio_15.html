<h3>Monto a pagar por consumo de luz eléctrica</h3>
<form action="/Ejercicios_PHP/backend/Ejercicio_15.php" method="post">
    <h2>Digite las lecturas del medidor y el costo</h2>

    <label for="lectura_ant">Lectura anterior (kWh)</label>
    <input type="number" id="lect_ant" name="lect_ant" placeholder="1250" step="any" min="0" required>
    <br>
    <label for="lectura_act">Lectura actual (kWh)</label>
    <input type="number" id="lect_act" name="lect_act" placeholder="1480" step="any" min="0" required>
    <br>
    <label for="costo_kw">Costo por kilovatio</label>
    <input type="number" id="costo_kw" name="costo_kw" placeholder="650" step="any" min="0" required>
    <br>
    <button type="submit">Calcular monto</button>
</form>

<p class="resultado"></p>
