<h3>Nómina del trabajador: asignaciones y deducciones</h3>
<form action="/Ejercicios_PHP/backend/Ejercicio_11.php" method="post">
    <h2>Digite los datos del trabajador</h2>
 
    <label for="nombre">Nombre del trabajador</label>
    <input type="text" id="nombre" name="nombre" maxlength="60" placeholder="Carlos" required>
    <br>
    <label for="horanormal">Horas normales trabajadas</label>
    <input type="number" id="horanormal" name="horanormal" placeholder="40" step="any" min="0" required>
    <br>
    <label for="horaextra">Horas extras trabajadas</label>
    <input type="number" id="horaextra" name="horaextra" placeholder="5" step="any" min="0" required>
    <br>
    <label for="no_hijos">Número de hijos</label>
    <input type="number" id="no_hijos" name="no_hijos" placeholder="2" step="1" min="0" required>
    <br>
    <label for="valorH">Valor de una hora normal</label>
    <input type="number" id="valorH" name="valorH" placeholder="8000" step="any" min="0" required>
    <br>
    <button type="submit">Calcular nómina</button>
</form>
 
<p class="resultado"></p>
