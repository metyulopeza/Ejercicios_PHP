<h3>Ejercicio 25 - Aumento de Sueldo según Categoría de Ingreso</h3>
<form action="/Ejercicios_PHP/backend/Ejercicio_25.php" method="post">
    <label for="nombre">Nombre del trabajador</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
<br>
    <label for="sueldo">Sueldo actual (Bs.)</label>
    <input type="number" id="sueldo" name="sueldo" placeholder="Ej: 35000" step="0.01" required>
<br>
    <button type="submit">Procesar</button>
</form>

<p class="resultado"></p>
