<h3>Piezas fabricadas por lámina de hierro</h3>
<form action="/Ejercicios_PHP/backend/Ejercicio_16.php" method="post">
    <h2>Digite las medidas de la lámina y de la pieza</h2>

    <label for="largo">Largo de la lámina (m)</label>
    <input type="number" id="largo" name="largo" placeholder="4" step="any" min="0" required>
    <br>
    <label for="ancho">Ancho de la lámina (m)</label>
    <input type="number" id="ancho" name="ancho" placeholder="1.5" step="any" min="0" required>
    <br>
    <label for="consumo_pieza">Consumo de cada pieza (m)</label>
    <input type="number" id="consumo_pieza" name="consumo_pieza" placeholder="0.5" step="any" min="0" required>
    <br>
    <button type="submit">Calcular piezas</button>
</form>

<p class="resultado"></p>
