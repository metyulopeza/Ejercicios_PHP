<h3>Porcentaje anual cobrado en un préstamo</h3>
<form action="/Ejercicios_PHP/backend/Ejercicio_20.php" method="post">
    <h2>Digite los datos del préstamo</h2>

    <label for="captial">Capital prestado (X)</label>
    <input type="number" id="captial" name="captial" placeholder="1000000" step="any" min="0" required>
    <br>
    <label for="intereses">Intereses pagados (Y)</label>
    <input type="number" id="intereses" name="intereses" placeholder="240000" step="any" min="0" required>
    <br>
    <label for="tiempo">Tiempo en años</label>
    <input type="number" id="tiempo" name="tiempo" placeholder="4" step="any" min="0" required>
    <br>
    <button type="submit">Calcular porcentaje</button>
</form>

<p class="resultado"></p>
